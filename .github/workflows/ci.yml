name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the jar (parser)
        run: ./scripts/parse-smoke-test.sh "java -jar target/loglens.jar"

      - name: Smoke test the jar (stats)
        run: java -jar target/loglens.jar demo/mixed.log --stats --quiet

  build-linux-tz:
    name: Build & Test (Linux, TZ=Pacific/Apia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Pacific/Apia
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (non-default TZ)
        run: mvn -B -ntp verify

      - name: Smoke test the jar (parser, non-default TZ)
        run: ./scripts/parse-smoke-test.sh "java -jar target/loglens.jar"

      - name: Smoke test the jar (stats, non-default TZ)
        run: java -jar target/loglens.jar demo/mixed.log --stats --quiet

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the jar (parser)
        shell: bash
        run: ./scripts/parse-smoke-test.sh "java -jar target/loglens.jar"

      - name: Smoke test the jar (stats)
        shell: bash
        run: java -jar target/loglens.jar demo/mixed.log --stats --quiet

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the jar (parser)
        run: ./scripts/parse-smoke-test.sh "java -jar target/loglens.jar"

      - name: Smoke test the jar (stats)
        run: java -jar target/loglens.jar demo/mixed.log --stats --quiet