name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write            # create the release and upload the binaries

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # one platform failing shouldn't sink the others
      matrix:
        include:
          - os: ubuntu-latest
            asset: loglens-linux-x64
            binary: target/loglens
          - os: ubuntu-24.04-arm
            asset: loglens-linux-arm64
            binary: target/loglens
          - os: macos-latest          # Apple Silicon
            asset: loglens-macos-arm64
            binary: target/loglens
          - os: windows-latest
            asset: loglens-windows-x64.exe
            binary: target/loglens.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.2'   # pinned: a floating "21" once shipped a binary
          distribution: graalvm-community   # that silently dropped several parsers
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: mvn -B -ntp -Pnative package

      - name: Smoke-test the binary
        shell: bash
        run: |
          bin="${{ matrix.binary }}"
          "$bin" --version
          # Verify the binary actually PARSES, not just runs. A native build can
          # compile and report --version yet silently fail to match some formats
          # (this happened once). Feed one line per format and fail if any comes
          # back verbatim instead of rendered as "HH:MM:SS  LEVEL  ...".
          check() {
            out="$(printf '%s\n' "$2" | "$bin" --no-color)"
            printf '%-8s %s\n' "$1" "$out"
            case "$out" in
              "$2"*) echo "PARSE REGRESSION: $1 line passed through verbatim" >&2; exit 1 ;;
            esac
          }
          check json    '{"level":"error","msg":"x","ts":"2026-01-01T00:00:00Z"}'
          check klog     'I0101 00:00:00.000000 1 controller.go:1] x'
          check logfmt   'level=info msg="x" ts=2026-01-01T00:00:00Z'
          check airflow  '[2026-01-01T00:00:00Z +0000] INFO - x'
          check log4j    '2026-01-01 00:00:00,000 INFO SparkContext: x'

      - name: Stage binary under its platform name
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          # A tag with a hyphen (v0.2.0-rc1) is published as a pre-release,
          # so you can test the full matrix before cutting the real thing.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
